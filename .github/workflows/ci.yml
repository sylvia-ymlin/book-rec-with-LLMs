name: Book Recommender CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  schedule:
    - cron: "0 2 * * *"   # UTC 02:00 nightly regression

permissions:
  contents: read
  packages: write          # required for GHCR push

# ── Jobs ──────────────────────────────────────────────────────────────────────

jobs:

  # ── 1. Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install Ruff
        run: pip install ruff

      - name: Ruff – fatal errors only
        run: ruff check . --select=E9,F63,F7,F82 --target-version=py310

      - name: Ruff – full lint (non-blocking stats)
        run: ruff check . --exit-zero --statistics

  # ── 2. Unit tests (fast, no external API) ────────────────────────────────────
  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Unit tests (exclude integration)
        run: |
          pytest tests/ -m "not integration" -v \
            --cov=src --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=60
        env:
          PYTHONPATH: ${{ github.workspace }}
          # Stub tokens so Settings validates without real secrets
          HUGGINGFACEHUB_API_TOKEN: "mock_token"
          DEEPSEEK_API_KEY: "mock_key"
          LLM_PROVIDER: "mock"
          USE_LLM_EVALUATE: "false"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  # ── 3. Integration tests (real graph wiring, no live API) ────────────────────
  integration-test:
    name: Integration Tests
    needs: unit-test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio pytest-cov
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Integration tests
        run: |
          pytest tests/ -m integration -v \
            --cov=src --cov-report=term-missing \
            --tb=short --timeout=60
        env:
          PYTHONPATH: ${{ github.workspace }}
          HUGGINGFACEHUB_API_TOKEN: "mock_token"
          DEEPSEEK_API_KEY: "mock_key"
          LLM_PROVIDER: "mock"
          USE_LLM_EVALUATE: "false"

  # ── 4. Docker build + push (main/master only) ─────────────────────────────────
  docker-build:
    name: Docker Build & Push
    needs: [ unit-test, integration-test ]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_SHA=${{ github.sha }}

      - name: Container health smoke test
        # Pull the just-pushed image, start it, poll /health for 30 s
        run: |
          IMAGE="ghcr.io/${{ github.repository }}:latest"
          docker run -d --name smoker \
            -e HUGGINGFACEHUB_API_TOKEN=mock_token \
            -e DEEPSEEK_API_KEY=mock_key \
            -e LLM_PROVIDER=mock \
            -e USE_LLM_EVALUATE=false \
            -p 8000:8000 "$IMAGE"
          echo "Waiting for container to be healthy..."
          for i in $(seq 1 15); do
            sleep 2
            CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/health || echo "000")
            echo "  attempt $i → HTTP $CODE"
            if [ "$CODE" = "200" ]; then echo "✓ Health OK"; exit 0; fi
          done
          echo "✗ Health check failed"; docker logs smoker; exit 1
