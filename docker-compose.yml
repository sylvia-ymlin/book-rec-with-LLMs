version: '3.8'

services:
  api:
    build: .
    entrypoint: ["uvicorn", "src.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    environment:
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
    restart: unless-stopped

  ui:
    build: .
    entrypoint: ["python", "app.py"]
    ports:
      - "7860:7860"
    volumes:
      - .:/app
      - chroma_data:/app/chroma_db
    environment:
      - HUGGINGFACEHUB_API_TOKEN=${HUGGINGFACEHUB_API_TOKEN}
    depends_on:
      - api
    restart: unless-stopped

volumes:
  chroma_data:
