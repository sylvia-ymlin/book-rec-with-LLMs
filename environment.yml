name: book-rec
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # --- Core Backend ---
    - fastapi>=0.109.0
    - uvicorn[standard]>=0.27.0
    - pydantic>=2.0.0
    - python-dotenv
    
    # --- Data & Math ---
    - numpy<2.0.0  # Constraint for broad compatibility
    - pandas>=2.0.0
    
    # --- AI / ML Core (M1 Friendly) ---
    - torch
    - sentence-transformers>=2.2.2
    - scikit-learn
    
    # --- RAG Stack ---
    - langchain>=0.1.0
    - langchain-community>=0.0.10
    - langchain-openai>=0.0.5
    - langchain-chroma>=0.1.0
    - chromadb>=0.4.22
    - huggingface-hub>=0.20.0
    
    # --- Infrastructure ---
    - redis
    - prometheus-client
    - python-json-logger
    - httpx
    
    # --- Dev Tools ---
    - ruff
    - pytest
    - black
