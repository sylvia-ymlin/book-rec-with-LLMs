name: book-rec
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - pip:
    # --- Core Backend ---
    - fastapi>=0.109.0,<0.116.0
    - uvicorn[standard]>=0.27.0
    - pydantic>=2.0.0,<3.0.0
    - python-dotenv
    
    # --- Data & Math ---
    - numpy>=1.24.0,<2.0.0
    - pandas>=2.0.0,<3.0.0
    
    # --- AI / ML Core ---
    - torch>=2.0.0
    - sentence-transformers>=2.2.2,<4.0.0
    - scikit-learn>=1.3.0
    - scipy>=1.11.0
    - transformers>=4.40.0,<5.0.0
    - gensim>=4.3.0
    - lightgbm>=4.0.0
    - xgboost>=2.0.0
    - shap>=0.45.0
    - faiss-cpu
    
    # --- RAG Stack ---
    - langchain>=0.2.0,<0.4.0
    - langchain-community>=0.2.0,<0.4.0
    - langchain-openai>=0.1.0
    - langchain-chroma>=0.1.0
    - langchain-huggingface>=0.0.3
    - chromadb>=0.4.22
    - huggingface-hub>=0.23.0

    # --- Infrastructure ---
    - redis
    - prometheus-client
    - httpx
    - tqdm
    
    # --- Dev Tools ---
    - ruff
    - pytest

